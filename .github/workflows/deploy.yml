name: Deploy til Azure Static Web Apps

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_MEADOW }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /public
          skip_app_build: true

      - name: SKUDDSIKKER SJEKK - Avvik på nice-meadow, ALDRI calm-plant
        run: |
          sleep 15
          CALM=$(curl -s --max-time 15 https://calm-plant-0bcddaa03.7.azurestaticapps.net/ | grep -o '<title>[^<]*</title>' | head -1)
          echo "calm-plant tittel: $CALM"
          if echo "$CALM" | grep -qi "avvik"; then
            echo "=========================================="
            echo "KRISE: Avvikssystemet HAR OVERSKREVET Kapasitetsprognose!"
            echo "Tokenet AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_MEADOW er FEIL!"
            echo "Gjenopprett manuelt: Gå til legendary-fiesta Actions og kjoer Re-run all jobs"
            echo "=========================================="
            exit 1
          fi
          echo "OK: calm-plant viser Kapasitetsprognose - ikke avvikssystem. Alt er bra!"
