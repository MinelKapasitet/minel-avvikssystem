name: Deploy Avviksregistrering til Azure Static Web Apps (nice-meadow)

on:
  push:
      branches: [main]

      jobs:
        deploy:
            runs-on: ubuntu-latest
                steps:
                      - uses: actions/checkout@v4

                            - name: Inject GH_DATA_TOKEN
                                    env:
                                              GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
                                                      run: |
                                                                sed -i "s|__GH_DATA_TOKEN__|${GH_DATA_TOKEN}|g" public/VIA_QA.html

                                                                      - name: Deploy til nice-meadow
                                                                              uses: Azure/static-web-apps-deploy@v1
                                                                                      with:
                                                                                                azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AVVIK }}
                                                                                                          repo_token: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                    action: upload
                                                                                                                              app_location: /public
                                                                                                                                        skip_app_build: true
                                                                                                                                        
                                                                                                                                              - name: "SKUDDSIKKER SJEKK: Bekreft at calm-plant IKKE ble overskrevet"
                                                                                                                                                      run: |
                                                                                                                                                                echo "Venter 30 sekunder pa at deploy er live..."
                                                                                                                                                                          sleep 30
                                                                                                                                                                                    echo "Sjekker calm-plant URL..."
                                                                                                                                                                                              CALM_CONTENT=$(curl -s --max-time 15 https://calm-plant-0bcddaa03.7.azurestaticapps.net || echo "")
                                                                                                                                                                                                        if echo "$CALM_CONTENT" | grep -qi "Avviksregistrering"; then
                                                                                                                                                                                                                    echo ""
                                                                                                                                                                                                                                echo "=========================================================="
                                                                                                                                                                                                                                            echo "KRITISK FEIL: calm-plant viser Avviksregistrering!"
                                                                                                                                                                                                                                                        echo "=========================================================="
                                                                                                                                                                                                                                                                    echo "Avvikssystemet ble deployet til feil SWA (calm-plant)."
                                                                                                                                                                                                                                                                                echo "AARSAK: Hemmeligheten AZURE_STATIC_WEB_APPS_API_TOKEN_AVVIK"
                                                                                                                                                                                                                                                                                            echo "inneholder feil token (calm-plant istedenfor nice-meadow)."
                                                                                                                                                                                                                                                                                                        echo "LOESNING: Oppdater hemmeligheten i GitHub med nice-meadow-tokenet"
                                                                                                                                                                                                                                                                                                                    echo "fra Azure Portal -> minel-avvik-swa -> Manage deployment token"
                                                                                                                                                                                                                                                                                                                                echo "=========================================================="
                                                                                                                                                                                                                                                                                                                                            exit 1
                                                                                                                                                                                                                                                                                                                                                      fi
                                                                                                                                                                                                                                                                                                                                                                echo "OK: calm-plant viser IKKE avvikssystem. Deploy var korrekt."
